<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Caravan</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="ProfilePage.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid">
      <div class="nav-left">
        <a class="navbar-brand" href="index.html">
          <img
            src="Images/CaravanLogo_Transparent.png"
            alt="Caravan"
            height="50"
            id="Caravan_Logo"
          />
        </a>
      </div>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav nav-center">
          <li class="nav-item1"><a class="nav-link" href="index.html">HOME</a></li>
          <li class="nav-item1"><a class="nav-link" href="storepage.html">MARKET</a></li>
          <li class="nav-item1"><a class="nav-link" href="FAQs.html">FAQS</a></li>
        </ul>

        <ul class="navbar-nav nav-right">
          <li class="nav-item2"><a class="nav-link" href="cartpage.html">CART</a></li>
          <li class="nav-divider">|</li>
          <li class="nav-item2"><a class="nav-link active" href="profilepage.html">PROFILE</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Header Title -->
  <header class="page-header">
    <h1>My Profile Page</h1>
  </header>

  <!-- Main Profile Layout Container -->
  <main class="profile-container">
    
    <!-- Sidebar Navigation -->
    <aside class="profile-sidebar">
      <div class="user-greeting">
        <div class="avatar-circle">
          <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="user-text">
          <span class="hi-text">Hi,</span>
          <span class="user-name" id="profileUserName">User Account</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button class="menu-item" data-tab="overview">Account Overview</button>
        <button class="menu-item" data-tab="payment">Payment Methods</button>
        <button class="menu-item active" data-tab="details">My Details</button>
        <button class="menu-item" data-tab="vouchers">Vouchers</button>
        <button class="menu-item" data-tab="wishlist">Wishlist</button>
        <button class="menu-item" data-tab="orders">Order History</button>
      </nav>
    </aside>

    <!-- Tab Contents Container -->
    <section class="profile-content">
      
      <!-- Tab 1: Account Overview -->
      <div class="tab-pane" id="overview">
        <h2 class="content-title">Account Overview</h2>
        <div class="data-container" id="overviewContainer">
          <!-- Populated by database JS -->
        </div>
      </div>

      <!-- Tab 2: Payment Methods -->
      <div class="tab-pane" id="payment">
        <h2 class="content-title">Payment Methods</h2>
        <div class="data-container" id="paymentContainer">
          <!-- Populated by database JS -->
        </div>
      </div>

      <!-- Tab 3: My Details (Active Tab) -->
      <div class="tab-pane active" id="details">
        <h2 class="content-title">My Details</h2>
        
        <div class="data-container" id="addressListContainer">
          <!-- Empty address cards dynamic mount target -->
        </div>

        <button class="add-btn" id="addAddressBtn">Add a New Address</button>
      </div>

      <!-- Tab 4: Vouchers -->
      <div class="tab-pane" id="vouchers">
        <h2 class="content-title">My Vouchers</h2>

        <div class="data-container" id="vouchersListContainer">
          <!-- Empty voucher list dynamic mount target -->
        </div>
      </div>

      <!-- Tab 5: Wishlist -->
      <div class="tab-pane" id="wishlist">
        <h2 class="content-title">Wishlist</h2>
        <div class="data-container" id="wishlistContainer">
          <!-- Populated by database JS -->
        </div>
      </div>

      <!-- Tab 6: Order History -->
      <div class="tab-pane" id="orders">
        <h2 class="content-title">Order History</h2>
        <div class="data-container" id="ordersContainer">
          <!-- Populated by database JS -->
        </div>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="ProfilePage.js"></script>
</body>
</html>
